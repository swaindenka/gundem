name: Derle ve Yayınla

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller

      - name: Testler
        run: python -m pytest -q tests

      - name: .exe derle
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name GundemDoldurucu
          --add-data "sablon/BASLIK_TEST.docx;sablon"
          --hidden-import win32timezone
          main.py

      - name: .exe çalışıyor mu?
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\GundemDoldurucu.exe -ArgumentList "--self-test", "$PWD\selftest.txt" -PassThru -Wait
          if (-not (Test-Path selftest.txt)) { throw "Self-test başarısız (çıkış kodu: $($p.ExitCode))" }
          Get-Content selftest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: GundemDoldurucu
          path: dist/GundemDoldurucu.exe

      - name: Sürüm numarasını oku
        id: surum
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $v = (Select-String -Path gundem_doldur/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" 2>$null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Release oluştur
        if: github.event_name != 'pull_request' && steps.surum.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.surum.outputs.version }}
          name: Gündem Doldurucu v${{ steps.surum.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/GundemDoldurucu.exe
          body: |
            Windows için tek dosyalık program: **GundemDoldurucu.exe** dosyasını indirip çift tıklayın (kurulum gerekmez).

            - Kaynak belgeler: `.docx` ve Word 97-2003 `.doc`
            - Üstteki tablodan Esas / Mahkeme / Daire / Daire kararı / Konu alanları alınır
            - `*******` işaretinin altındaki hakim bilgileri tabloya satır satır yazılır
            - Gündem tarihi programda seçilir, haftanın günü otomatik yazılır
